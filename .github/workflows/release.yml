name: Release

# Tag-driven, and only tag-driven. `main` is the release line; the tag is the
# promise, which is why every check runs *before* anything is uploaded: a PyPI version can
# never be unpublished or overwritten.
#
# `workflow_dispatch` exists to dry-run the verify job -- the version guard, the suite, the
# guards and a real build -- without publishing anything. Publishing steps are skipped unless
# this run is a tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # The verify job asks the Actions API whether this commit was ever driven end to end
  # (windows-gui.yml). Listing workflow runs needs this, and it is the only thing added for
  # it: read, nothing else.
  actions: read

jobs:
  verify:
    name: verify the tag agrees with the package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # First, and before anything else: three files name the release, and a mismatch is the
      # mistake that is only discovered after PyPI already has the package.
      - name: The tag, the package, server.json and the changelog have to agree
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            # A dry run has no tag: check what the tree currently claims to be.
            TAG="v$(python -c "import pyjab_mcp; print(pyjab_mcp.__version__)")"
            echo "::notice::dry run -- checking $TAG (a .devN version is expected to fail)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          python tools/check_release_version.py "$TAG" || {
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::warning::a dry run is allowed to find the version unprepared"
            else
              exit 1
            fi
          }

      # The half-published hazard: `github-release` needs only `verify`, while `pypi` -- where a
      # duplicate version is actually refused -- is a separate job behind a human approval. So a
      # tag for a version that is already on PyPI reaches the release job *first* and creates a
      # GitHub release with no matching package. This is the pre-flight from docs/RELEASING.md,
      # moved where it cannot be forgotten: it needs the `version` output of the step above, and
      # it must run before anything is published. The verdict is
      # tools/check_release_unpublished.py, pinned by tests/test_guards.py -- what stays here is
      # only what is not a verdict: the two curls and the arguments. A dry run
      # (`workflow_dispatch`) runs on main's HEAD, where a version may legitimately be prepared
      # but not yet published, so every refusal is a warning and the exit status is 0, exactly
      # like the version guard and the L3 gate.
      - name: The version is not already published
        env:
          # `contents: read` is already granted at the top of this workflow, and it covers
          # reading a release, so no new permission is needed for either call.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "checking whether pyjab-mcp ${VERSION} is already published"

          PYPI_BODY="$(mktemp)"
          PYPI_CODE="$(curl -sS -o "$PYPI_BODY" -w '%{http_code}' \
            "https://pypi.org/pypi/pyjab-mcp/${VERSION}/json")" || PYPI_CODE="000"  # 000: no HTTP response at all

          RELEASE_BODY="$(mktemp)"
          RELEASE_CODE="$(curl -sS -o "$RELEASE_BODY" -w '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}")" || RELEASE_CODE="000"

          DRY_RUN=()
          if [ "${{ github.event_name }}" != "push" ]; then
            DRY_RUN=(--dry-run)
          fi
          python tools/check_release_unpublished.py \
            --version "$VERSION" \
            --pypi-code "$PYPI_CODE" --pypi-body "$PYPI_BODY" \
            --release-code "$RELEASE_CODE" "${DRY_RUN[@]}"

      # L3 is the only layer that can say a tool call worked against a live window, and
      # `windows-gui.yml` runs weekly on a schedule (and on dispatch) rather than as part of the
      # default CI, so a green default CI run says nothing about it.
      # "A green L3 run on the tagged commit" is a step in the release procedure
      # (docs/RELEASING.md) that a human had to remember; this is that rule expressed where the
      # other "is the tag true" checks live. A tag whose commit was never driven end to end
      # publishes a live path nothing exercised, and PyPI cannot take it back.
      #
      # The verdict is `tools/check_release_l3.py`, pinned by `tests/test_guards.py` -- this was
      # fifteen cases of Python in a `run:` block where nothing could test it, and a check whose
      # failure path has never run is decoration. What stays here is only what is not a verdict:
      # the event, the curl, and the arguments. A dry run (`workflow_dispatch`) runs on main's
      # HEAD, which normally has no L3 run yet, so -- like the version guard above -- every
      # refusal is a warning and the exit status is 0; a green dry run therefore does not prove
      # the `actions: read` permission, which is why the tool's 401/403 hint says so.
      - name: L3 was green on this commit (windows-gui.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `windows-gui.yml` is accepted as the workflow id. head_sha is the commit a run was
          # dispatched for, and on a tag push github.sha is the tagged commit itself.
          RUNS="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/windows-gui.yml/runs?head_sha=${GITHUB_SHA}&per_page=100"
          echo "asking the Actions API for windows-gui.yml runs at ${GITHUB_SHA}"

          BODY="$(mktemp)"
          CODE="$(curl -sS -o "$BODY" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$RUNS")" || CODE="000"  # 000: no HTTP response at all (DNS, TLS, timeout)

          DRY_RUN=()
          if [ "${{ github.event_name }}" != "push" ]; then
            DRY_RUN=(--dry-run)
          fi
          python tools/check_release_l3.py \
            --body "$BODY" --http-code "$CODE" --sha "$GITHUB_SHA" "${DRY_RUN[@]}"

      - name: The portable suite
        run: python -m pytest tests/ -q

      - name: The guards
        run: |
          python tools/check_pyjab_api_surface.py
          python tools/check_documented_surface.py
          python tools/check_local_only_files.py
          python tools/check_changelog_immutable.py
          python tools/check_published_references.py
          python tools/check_pyjab_changelog.py
          python tools/check_pyjab_readiness.py

      - name: Build, and check the artifact rather than the rules
        run: |
          python -m build
          python tools/check_dist_contents.py --dist dist
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: publish to PyPI
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Trusted publishing: no token in this repository at all. The environment name is part of
    # what PyPI checks, so it is configured on the PyPI side once (docs/RELEASING.md).
    environment:
      name: pypi
      url: https://pypi.org/p/pyjab-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # The metadata publish, in its own workflow so that it can also be run by hand: at 0.1.0
  # this job failed *after* PyPI had published, and there was no way to publish the metadata
  # alone afterwards (see publish-registry.yml for what that cost).
  registry:
    name: publish to the MCP Registry
    needs: [verify, pypi]
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-registry.yml
    with:
      version: ${{ needs.verify.outputs.version }}

  github-release:
    name: the GitHub release, with the changelog as its notes
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write the notes from the release's changelog section
        run: |
          python tools/check_release_version.py --notes "${{ github.ref_name }}" > NOTES.md
          test -s NOTES.md || { echo "::error::no changelog section for ${{ github.ref_name }}"; exit 1; }

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file NOTES.md \
            --verify-tag

  # The distribution artifact: one file a user installs without a build step. It is downstream
  # of both jobs on purpose -- `verify`, so it can only ever run against a checked artifact,
  # and `github-release`, because on a tag the bundle is attached to that release, which has to
  # exist first.
  #
  # It runs on *both* triggers, and that is the deliberate part. `github-release` is skipped on
  # a `workflow_dispatch`, and a job that needs a skipped job is skipped with it -- so without
  # `always()` this job would only ever run on a tag, and a tag cannot be taken back. A job
  # nobody can run before the irreversible step is a job nobody can verify, which is the same
  # reason the version guard, the pre-flight and the L3 gate all take a dry run.
  # `needs.verify.result == 'success'` keeps the refusal path: a tag whose checks failed does
  # not get a bundle built from its artifact.
  mcpb:
    name: build the MCPB bundle
    needs: [verify, github-release]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      # Only the tag path needs it, for `gh release upload`; the dispatch path builds,
      # validates and uploads the bundle as a workflow artifact and touches nothing.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The packer checks each vendored tree against the *target* interpreter's PEP 508 markers
      # -- `pip --python-version` changes which wheels are eligible and nothing else -- and that
      # needs `packaging`. It is declared in the project's own dev extra **for its own sake**,
      # not relied on as a dependency of `build` and `twine`, so this job installs `".[dev]"`
      # and names nothing a second time here.
      - name: Install the build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # The packaging logic is `tools/build_mcpb.py` and not a `run:` block, for the same
      # reason the L3 verdict and the pre-flight are scripts: it is pinned offline by
      # tests/test_packaging.py, which a shell snippet inside YAML cannot be. What stays here
      # is the invocation and nothing else -- including `--validate-with-mcpb`, which has the
      # packer hand Anthropic's CLI the manifest read back *out of the built archive*.
      - name: Build the MCPB bundle
        run: python tools/build_mcpb.py --dist dist --out dist --validate-with-mcpb

      # On every trigger, so the bundle is something a reviewer can download and unpack even
      # when the host's install path is not what is being exercised.
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: dist/*.mcpb

      # The only step whose subject is the release, and the only conditional one. It is gated on
      # the release *existing*: `always()` lets this job run when `github-release` failed on a
      # tag, and without the second half of this condition the failure would surface here as a
      # secondary "release not found", hiding the cause. Not running is the honest outcome.
      #
      # No `--clobber`: a released asset is not replaced, so a re-run that finds the bundle
      # already attached fails and says so rather than quietly publishing a different file --
      # the dependencies are resolved fresh on every run, so two builds are not byte-identical.
      - name: Attach the bundle to the release
        if: github.event_name == 'push' && needs.github-release.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/*.mcpb
