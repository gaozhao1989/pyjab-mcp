name: Release

# Tag-driven, and only tag-driven. `main` is the release line; the tag is the
# promise, which is why every check runs *before* anything is uploaded: a PyPI version can
# never be unpublished or overwritten.
#
# `workflow_dispatch` exists to dry-run the verify job -- the version guard, the suite, the
# guards and a real build -- without publishing anything. Publishing steps are skipped unless
# this run is a tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # The verify job asks the Actions API whether this commit was ever driven end to end
  # (windows-gui.yml). Listing workflow runs needs this, and it is the only thing added for
  # it: read, nothing else.
  actions: read

jobs:
  verify:
    name: verify the tag agrees with the package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # First, and before anything else: three files name the release, and a mismatch is the
      # mistake that is only discovered after PyPI already has the package.
      - name: The tag, the package, server.json and the changelog have to agree
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            # A dry run has no tag: check what the tree currently claims to be.
            TAG="v$(python -c "import pyjab_mcp; print(pyjab_mcp.__version__)")"
            echo "::notice::dry run -- checking $TAG (a .devN version is expected to fail)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          python tools/check_release_version.py "$TAG" || {
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::warning::a dry run is allowed to find the version unprepared"
            else
              exit 1
            fi
          }

      # L3 is the only layer that can say a tool call worked against a live window, and
      # `windows-gui.yml` runs weekly on a schedule (and on dispatch) rather than as part of the
      # default CI, so a green default CI run says nothing about it.
      # "A green L3 run on the tagged commit" is a step in the release procedure
      # (docs/RELEASING.md) that a human had to remember; this is that rule expressed where the
      # other "is the tag true" checks live. A tag whose commit was never driven end to end
      # publishes a live path nothing exercised, and PyPI cannot take it back.
      #
      # Two answers that must not be confused: no run of windows-gui.yml at this commit, and
      # the Actions API could not be read at all. An unread answer is not zero -- a check that
      # cannot tell "no green run" from "could not read" has to fail, not pass. A dry run
      # (`workflow_dispatch`) is dispatched on main's HEAD, which normally has no L3 run yet, so
      # -- like the version guard above -- it reports the finding and does not fail the job.
      - name: L3 was green on this commit (windows-gui.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERDICT="error"
          else
            VERDICT="warning"
          fi

          # `windows-gui.yml` is accepted as the workflow id. head_sha is the commit a run was
          # dispatched for, and on a tag push github.sha is the tagged commit itself.
          RUNS="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/windows-gui.yml/runs?head_sha=${GITHUB_SHA}&per_page=100"
          echo "asking the Actions API for windows-gui.yml runs at ${GITHUB_SHA}"

          BODY="$(mktemp)"
          CODE="$(curl -sS -o "$BODY" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$RUNS")" || CODE="000"  # 000: no HTTP response at all (DNS, TLS, timeout)

          if [ "${CODE}" != "200" ]; then
            # Not a verdict about L3: the gate could not be read.
            echo "::${VERDICT}::the Actions API could not be read for windows-gui.yml at ${GITHUB_SHA} (HTTP ${CODE}) -- this gate is unverified, which is not the same as satisfied"
            if [ "${CODE}" = "401" ] || [ "${CODE}" = "403" ]; then
              # Name the likely cause, because the message above is all a maintainer would see.
              # And say what a dry run can and cannot prove: on `workflow_dispatch` this branch
              # exits 0 with a warning, so a green dry run does NOT prove the permission -- the
              # proof is `PASSED: run <id>` in the log of a run whose commit has an L3 run.
              echo "::notice::HTTP ${CODE} from the Actions API usually means this workflow is missing 'actions: read'. Note that a dry run downgrades this to a warning, so a green dry run does not prove the permission -- look for 'PASSED: run <id>' instead."
            fi
            head -c 2000 "${BODY}" || true
            echo
            if [ "${VERDICT}" = "error" ]; then exit 1; fi
            exit 0
          fi

          python3 - "${BODY}" "${VERDICT}" "${GITHUB_SHA}" <<'PY'
          import json
          import sys

          path, verdict, sha = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              with open(path) as handle:
                  payload = json.load(handle)
              runs = payload["workflow_runs"]
              total = payload["total_count"]
              if not isinstance(runs, list) or not isinstance(total, int):
                  raise ValueError("workflow_runs/total_count have an unexpected shape")
          except (OSError, ValueError, KeyError) as exc:
              print(f"::{verdict}::the Actions API answer could not be read ({exc!r}) -- unverified, which is not the same as satisfied")
              raise SystemExit(1 if verdict == "error" else 0)

          print(f"windows-gui.yml at {sha}: {total} run(s) match, {len(runs)} read")
          for run in runs:
              print(f"  run {run.get('id')}: event={run.get('event')} status={run.get('status')} "
                    f"conclusion={run.get('conclusion')} {run.get('html_url')}")

          green = [run for run in runs if run.get("conclusion") == "success"]
          if green:
              print(f"PASSED: run {green[0].get('id')} of windows-gui.yml succeeded at {sha} -- "
                    f"{green[0].get('html_url')}")
              raise SystemExit(0)

          if total > len(runs):
              # A run whose conclusion could not be read is not a green run, and candidates
              # that were never read are not "no green run" either.
              reason = (f"{total} runs match {sha} but only {len(runs)} were read, so a green "
                        f"one cannot be ruled out")
          elif runs:
              rejected = ", ".join(f"{run.get('id')} ({run.get('status')}/{run.get('conclusion')})"
                                   for run in runs)
              reason = f"no run of windows-gui.yml at {sha} succeeded; rejected: {rejected}"
          else:
              reason = (f"no windows-gui.yml run exists at {sha}: this commit was never driven "
                        f"end to end -- dispatch it and let it pass before tagging")
          print(f"::{verdict}::{reason}")
          raise SystemExit(1 if verdict == "error" else 0)
          PY

      - name: The portable suite
        run: python -m pytest tests/ -q

      - name: The guards
        run: |
          python tools/check_pyjab_api_surface.py
          python tools/check_documented_surface.py
          python tools/check_local_only_files.py
          python tools/check_changelog_immutable.py
          python tools/check_published_references.py
          python tools/check_pyjab_changelog.py
          python tools/check_pyjab_readiness.py

      - name: Build, and check the artifact rather than the rules
        run: |
          python -m build
          python tools/check_dist_contents.py --dist dist
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: publish to PyPI
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Trusted publishing: no token in this repository at all. The environment name is part of
    # what PyPI checks, so it is configured on the PyPI side once (docs/RELEASING.md).
    environment:
      name: pypi
      url: https://pypi.org/p/pyjab-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # The metadata publish, in its own workflow so that it can also be run by hand: at 0.1.0
  # this job failed *after* PyPI had published, and there was no way to publish the metadata
  # alone afterwards (see publish-registry.yml for what that cost).
  registry:
    name: publish to the MCP Registry
    needs: [verify, pypi]
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-registry.yml
    with:
      version: ${{ needs.verify.outputs.version }}

  github-release:
    name: the GitHub release, with the changelog as its notes
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write the notes from the release's changelog section
        run: |
          python tools/check_release_version.py --notes "${{ github.ref_name }}" > NOTES.md
          test -s NOTES.md || { echo "::error::no changelog section for ${{ github.ref_name }}"; exit 1; }

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file NOTES.md \
            --verify-tag
