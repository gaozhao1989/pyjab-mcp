  - commit: line:02c8f88bc084
    what: >-
      pyjab stops configuring logging: Logger no longer calls logging.basicConfig on the
      root logger. It now adds a NullHandler to its own logger and sets that logger's level
      (commit 8439ac4, PR #164; first released in 1.10.0). Nothing to change here.

      * The server has always owned its logging: pyjab_mcp/__main__.py calls
        logging.basicConfig(stream=sys.stderr) as its first act, before any pyjab import, so
        the sequence the marker warns about -- importing pyjab first and inheriting its
        format and level -- cannot happen in this program.
      * Nothing here uses pyjab's Logger. The API-surface guard records no touchpoint on
        pyjab.common.logger and fails the build if one appears.
      * The property that does matter is that pyjab's records still *propagate* to whatever
        the application configured, because a bridge that cannot enable Java Access Bridge
        logs an error and a server that never sees it reports a worse message to the model
        than the one pyjab wrote. Read from the source, not executed: the new __init__ adds a
        NullHandler and sets a level, and does not touch propagate (which stays True by
        default). tests/contract/test_pyjab_contract.py pins the observable half of that --
        a record logged through pyjab's Logger reaches a handler on the root logger -- and the
        weekly pyjab-drift job runs it against master, which is where the new implementation
        actually executes.
      * No pin change: `pyjab>=1.9.0` already admits 1.10.0.

