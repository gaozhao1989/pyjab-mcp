# What this project did about pyjab changes marked "Affects: pyjab-mcp".
#
# Why the state lives here rather than in pyjab's changelog: pyjab freezes its released
# changelog sections with a check of its own (`tools/check_changelog_immutable.py`), so
# "pyjab-mcp has dealt with this" cannot be appended there without editing published text.
#
# How it is checked: `tools/check_pyjab_changelog.py` reads pyjab's changelog (the sibling
# checkout, $PYJAB_CHANGELOG, or GitHub), finds every `Affects: pyjab-mcp` line, and fails
# for each one that is not listed under `acknowledged` -- and for each entry there whose
# marker has gone, because a stale acknowledgement claims something about a change that no
# longer exists.
#
# The id is the commit on the marker line, or `line:<digest>` when the marker carries none.
# A marker written without a commit is keyed by its text, so rewording it forces a fresh
# answer rather than inheriting the previous one.
#
# `context` below is **not enforced** and is not a place to avoid answering a marker: it
# records pyjab work from before the marker convention existed, so that the reasons this
# project pins what it pins are not lost. Anything listed there that later gets a marker
# must move up into `acknowledged`.

acknowledged:
  # Found by the guard while PR #36 was open, on the orchestrator's measurement of the catching
  # shape above: this project's handlers were read before anything was written here.
  - commit: line:4541adb8685e
    what: >-
      nothing needed -- the five calls now armed to raise RuntimeError
      (getAccessibleTextInfo, getAccessibleTextRange, getAccessibleTableCellInfo,
      setTextContents, getVersionInfo) are reached here only through pyjab's public API, and this
      package catches no JABException at all: the 32 broad `except Exception` handlers already
      treat a failed read as a failed read, so the new RuntimeError is caught where the old falsy
      return was handled. The read named as deliberately not armed, getAccessibleContextInfo, is
      the one every property goes through, so the search and lookup paths are unaffected. One
      behaviour change is an improvement and needs no code: a table cell that used to read falsy
      is now recorded in `unreadable` rather than possibly becoming an empty string. 1.11.0 is not
      on PyPI, so no supported install changes today; the drift job's contract tests against
      pyjab@master, where this change already is, are the backstop if this reasoning is wrong
      (last green: run 38047937968).

  # Found by the guard on 2026-10-10, mid-session, while the release this marker belongs to had
  # not happened: the drift machinery doing its job rather than a change anyone announced.
  - commit: line:504876b8fb65
    what: >-
      `visible_children_count` stops raising and returns the number: a childless self-painting
      panel and a refused call both answer `0`, so `0` no longer distinguishes "no visible
      children" from "could not read them". pyjab's note names the readable signal --
      `children_count`, from `getAccessibleContextInfo`, which raises first if the context info
      could not be read. Nothing to change here.

      * **This project never touches `visible_children_count`.** `grep -rn visible_children
        src/ tests/ tools/` has no hits, and the API-surface guard records no touchpoint on it,
        so the raising contract was never ours to depend on.
      * Our child-count logic reads `children_count` (the record field, `src/pyjab_mcp/tree.py`),
        which is exactly the signal the note recommends for telling "no children" from "could
        not read them" -- and that is what #18's `children(+n)` marker is built on.
      * It is **not in any release**: the marker says first released in 1.11.0, PyPI's latest is
        1.10.0, and the pin is `pyjab>=1.10.0`, so no supported install changes behaviour. The
        check happens where the note says it should: `tests/contract/test_pyjab_contract.py`
        runs against `pyjab@master` in the weekly drift job.
      * **One thing to look at when 1.11.0 is released**, recorded here so it is not lost:
        the record reader writes `int(raw.get("children_count") or 0)`, so a missing or `None`
        value reads as `0`. That is the one place where "the property refused" and "there are no
        children" could still collapse -- it is `as_record()`'s contract rather than this
        property's, and the contract test is what should pin it when the pin moves.

  # Keyed by `line:<digest>` rather than a commit, because pyjab's marker for this change
  # carries a release rather than a hash. That is the point of the fallback: the marker was
  # reworded (it used to name commit 8ec88a3, before the release section existed), so the id
  # changed and the answer had to be given again. The earlier text named the commit; it is
  # recorded here instead so the history is not lost.
  - commit: line:02c8f88bc084
    what: >-
      pyjab stops configuring logging: Logger no longer calls logging.basicConfig on the
      root logger. It now adds a NullHandler to its own logger and sets that logger's level
      (commit 8439ac4, PR #164; first released in 1.10.0). Nothing to change here.

      * The server has always owned its logging: pyjab_mcp/__main__.py calls
        logging.basicConfig(stream=sys.stderr) as its first act, before any pyjab import, so
        the sequence the marker warns about -- importing pyjab first and inheriting its
        format and level -- cannot happen in this program.
      * Nothing here uses pyjab's Logger. The API-surface guard records no touchpoint on
        pyjab.common.logger and fails the build if one appears.
      * The property that does matter is that pyjab's records still *propagate* to whatever
        the application configured, because a bridge that cannot enable Java Access Bridge
        logs an error and a server that never sees it reports a worse message to the model
        than the one pyjab wrote. Read from the source, not executed: the new __init__ adds a
        NullHandler and sets a level, and does not touch propagate (which stays True by
        default). tests/contract/test_pyjab_contract.py pins the observable half of that --
        a record logged through pyjab's Logger reaches a handler on the root logger -- and the
        weekly pyjab-drift job runs it against master, which is where the new implementation
        actually executes.
      * No pin change: `pyjab>=1.9.0` already admits 1.10.0.

context:
