# What this project did about pyjab changes marked "Affects: pyjab-mcp".
#
# Why the state lives here rather than in pyjab's changelog: pyjab freezes its released
# changelog sections with a check of its own (`tools/check_changelog_immutable.py`), so
# "pyjab-mcp has dealt with this" cannot be appended there without editing published text.
#
# How it is checked: `tools/check_pyjab_changelog.py` reads pyjab's changelog (the sibling
# checkout, $PYJAB_CHANGELOG, or GitHub), finds every `Affects: pyjab-mcp` line, and fails
# for each one that is not listed under `acknowledged` -- and for each entry there whose
# marker has gone, because a stale acknowledgement claims something about a change that no
# longer exists.
#
# The id is the commit on the marker line, or `line:<digest>` when the marker carries none.
# A marker written without a commit is keyed by its text, so rewording it forces a fresh
# answer rather than inheriting the previous one.
#
# **A follow-up is a second entry with the same id**, written after the first: a marker is
# answered once when it appears, and answered again when the world moves under that answer --
# a release landing, say. `load_acknowledged()` keys entries by id and keeps the last one, so
# the follow-up is the live answer, and the entry above it is left **verbatim** as the record
# of what was true when it was written. Do not rewrite the earlier text to say something it
# did not say.
#
# `context` below is **not enforced** and is not a place to avoid answering a marker: it
# records pyjab work from before the marker convention existed, so that the reasons this
# project pins what it pins are not lost. Anything listed there that later gets a marker
# must move up into `acknowledged`.

