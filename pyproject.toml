[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjab-mcp"
dynamic = ["version"]
description = "Drive Java desktop applications from an AI agent, through the JVM's own accessibility tree"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gary Gao", email = "gaozhao89@qq.com" }]
keywords = ["mcp", "java", "accessibility", "automation", "swing", "ai-agent"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    # NOTE: the "License ::" classifier is intentionally absent.  PEP 639 makes the SPDX
    # `license` expression authoritative, and setuptools rejects a build that carries
    # both.  See [project].license above.  Learned by running `pip install -e .` on this
    # skeleton and reading the error, rather than by copying the shape from memory.
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]

dependencies = [
    # The substrate. 1.9.0 is the floor because it is the first release with
    # `JABElement.walk` / `JABTree` (the M2 snapshot) and `JABElement.as_record` (the fields
    # a handle records and re-verifies against). 1.8.0 has neither, so a floor below 1.9.0
    # would permit an install that cannot snapshot. See AGENTS.md 6.
    "pyjab>=1.9.0",
    # The official SDK. `mcp.server.mcpserver.MCPServer` is the 2.x name for what used to be
    # FastMCP -- 1.x exposes `mcp.server.fastmcp` instead, so the floor is genuinely 2.0 and
    # a 1.x install fails at import, not at runtime.
    "mcp>=2.0",
    # MCPServer's own boundary type; declared because this project's tool signatures use it.
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    # 1.x in strict mode: the marker on the test is what turns a coroutine into a test.
    "pytest-asyncio>=0.21",
    # `python -m build` and `python -m twine check`, used by the CI `package` job. Listed
    # here rather than installed in a workflow `run:` step, because hand-listing is exactly
    # how pyjab's ci.yml and release.yml drifted and a release failed after its tag.
    "build>=1.2",
    "twine>=5.0",
    # `tools/check_pyjab_changelog.py` reads `acknowledged.yaml`, which is the record of
    # what was done about each pyjab change marked as affecting this project (AGENTS.md 1a).
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/gaozhao1989/pyjab-mcp"
Repository = "https://github.com/gaozhao1989/pyjab-mcp"
Issues = "https://github.com/gaozhao1989/pyjab-mcp/issues"

[project.scripts]
# The name the MCP client config will use. Not a guess: it is what docs/PLAN.md 4 fixes
# as the server name, per the {service}_mcp convention.
pyjab-mcp = "pyjab_mcp.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "pyjab_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyjab_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# A hung call into the accessibility bridge is the one failure a portable suite cannot
# see. faulthandler is built in, so this needs no dependency; on the timeout it prints
# every thread's stack, which names the call that never returned.
faulthandler_timeout = 300
# pytest-asyncio 1.x in strict mode: the marker on the test is the only thing that turns a
# coroutine into a test, so a forgotten marker is a skipped test rather than a silent one.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
